# Dev container additions to compose.yaml + compose.dev.yaml.
services:
  app:
    # The development image plus git, gh, curl and other tools (see the Dockerfile).
    build:
      target: devcontainer
    environment:
      # Claude Code keeps its sign-in and settings in this volume across rebuilds.
      CLAUDE_CONFIG_DIR: /root/.claude
    volumes:
      - claude-config:/root/.claude
      # The GitHub CLI sign-in (`gh auth login`) survives rebuilds the same way.
      - gh-config:/root/.config/gh
      # Claude Code's project memory lives outside the repo, so `git clean` or a fresh
      # clone never removes it. /app maps to the "-app" project folder.
      - ${CLAUDE_MEMORY_DIR:-${HOME:-${USERPROFILE}}/.claude-memory/tallyqueue}:/root/.claude/projects/-app/memory

volumes:
  claude-config:
  gh-config:
